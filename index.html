  <body style="margin: 0;">
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #FCFAF7; /* Warm premium pearl white */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        z-index: 999999;
        transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      }

      /* Logo container with breathing effect */
      .loader-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: logoEntrance 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, logoPulse 3s ease-in-out infinite 1s;
      }
      .loader-logo {
        height: 140px;
        width: auto;
        max-width: 240px;
        object-fit: contain;
        z-index: 2;
        filter: drop-shadow(0 10px 25px rgba(84, 57, 30, 0.08));
      }

      /* Text and progress wrapper */
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 2;
      }

      /* Tagline */
      .loader-tagline {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.35em;
        color: #54391E;
        text-transform: uppercase;
        opacity: 0;
        transform: translateY(10px);
        animation: contentFadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.4s forwards;
      }

      /* Premium Linear Progress Bar */
      .loader-progress-bar {
        width: 200px;
        height: 3px;
        background: rgba(84, 57, 30, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
        opacity: 0;
        transform: translateY(10px);
        animation: contentFadeIn 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.6s forwards;
      }
      .loader-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #54391E, #825B34);
        border-radius: 10px;
        animation: progressLoad 5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      /* Particle or glow effects for a high-end feel */
      .loader-glow {
        position: absolute;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, rgba(212, 163, 115, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        z-index: 1;
        animation: glowPulse 3s ease-in-out infinite;
      }

      @keyframes logoEntrance {
        from { opacity: 0; transform: scale(0.85) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes logoPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes glowPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      @keyframes contentFadeIn {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes progressLoad {
        to { width: 100%; }
      }

      /* Loader Exit Transition */
      body.loaded #initial-loader {
        opacity: 0;
        transform: scale(1.05);
        visibility: hidden;
      }
    </style>

    <!-- Clean White Premium Preloader -->
    <div id="initial-loader">
      <div class="loader-logo-container">
        <div class="loader-glow"></div>
        <img src="/src/assets/dentcity%20logo.png" class="loader-logo" alt="Dentcity" />
      </div>
      <div class="loader-content">
        <div class="loader-tagline">Crafting Your Perfect Smile</div>
        <div class="loader-progress-bar">
          <div class="loader-progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- Main React App Mount Point -->
    <div id="root"></div>

    <script>
      // Automatically dismiss the loader at exactly 3 seconds.
      // This creates the exact "fills in 3 seconds then opens" experience.
      setTimeout(() => {
        document.body.classList.add('loaded');
        
        // Remove from DOM entirely out of sight
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader) loader.remove();
        }, 600); // Wait for transition to finish
      }, 5000); // 5 seconds total wait time
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
